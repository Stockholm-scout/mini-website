<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Group 6 Mini Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Group 6 Web</a>
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="hamburger">&#9776;</label>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </header>

    <main>
        <div class="card">
            <h1>Contact Me</h1>
            <form action="#" method="POST">
                
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" placeholder="Enter the subject of your message" required>
                </div>

                <div class="form-group">
                    <label>Preferred Contact Method:</label>
                    <input type="radio" id="contact-email" name="contact_method" value="email" required>
                    <label for="contact-email" class="inline-label">Email</label>

                    <input type="radio" id="contact-phone" name="contact_method" value="phone">
                    <label for="contact-phone" class="inline-label">Phone</label>
                </div>

                <div class="form-group">
                    <label for="reason">Reason for Contact:</label>
                    <select id="reason" name="reason" required>
                        <option value="" disabled selected>-- Select a reason --</option>
                        <option value="feedback">Feedback</option>
                        <option value="support">Support</option>
                        <option value="collaboration">Collaboration</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Detailed Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your detailed message here..." required></textarea>
                </div>

                <div class="form-group">
                    <div>
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        <label for="newsletter" class="inline-label">Subscribe to Newsletter</label>
                    </div>
                    <div>
                        <input type="checkbox" id="updates" name="updates" value="yes">
                        <label for="updates" class="inline-label">Receive Updates</label>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset Form</button>
                </div>

            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Group 6 Web Development Team. All Rights Reserved.</p>
        <div class="social-links">
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
            <a href="https://twitter.com" target="_blank">X (Twitter)</a>
        </div>
    </footer>

</body>
</html>
